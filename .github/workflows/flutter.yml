name: Flutter checks

on:
  push:
    branches: [midterm-exam]
  pull_request:
    branches: [midterm-exam]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: midterm-validated-build
          path: |
            pubspec.lock
            build/web/
