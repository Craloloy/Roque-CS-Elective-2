name: flutter_ecommerce_app
description: MagiStore campus shop.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_riverpod: 3.0.3
  go_router: ^18.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/products/
    - assets/branding/
    - assets/references/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
