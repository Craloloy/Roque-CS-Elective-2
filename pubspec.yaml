name: flutter_ecommerce_app
description: MagiStore campus merchandise and express pickup demo.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/products/
    - assets/branding/
    - assets/references/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
